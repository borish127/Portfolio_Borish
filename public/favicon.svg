<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@900&amp;display=swap');
      .fav-text {
        font-family: 'Nunito', 'Arial Rounded MT Bold', 'Helvetica Rounded', sans-serif;
        font-weight: 900;
      }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#09090b" flood-opacity="0.1" />
    </filter>
  </defs>
  <!-- Material 3 Rounded Squircle Shape -->
  <rect x="8" y="8" width="112" height="112" rx="36" fill="url(#bg-grad)" filter="url(#glow)" />
  <!-- Letter Initials 'BH' perfectly centered horizontally and vertically -->
  <text x="64" y="64" text-anchor="middle" dominant-baseline="central" class="fav-text" font-size="52" fill="url(#text-grad)" letter-spacing="-0.02em">BH</text>
</svg>
